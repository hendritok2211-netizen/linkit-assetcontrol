services:
  # Laravel Web Service
  - type: web
    name: linkit-assetcontrol
    runtime: php
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: LinkIt Asset Control
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://linkit-assetcontrol.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: linkit-assetcontrol-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: linkit-assetcontrol-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: linkit-assetcontrol-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: linkit-assetcontrol-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: linkit-assetcontrol-db
          property: password

databases:
  # MySQL Database
  - name: linkit-assetcontrol-db
    databaseName: linkit_assetcontrol
    user: linkit_user
